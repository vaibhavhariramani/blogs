<script>
  (function () {
    var btn = document.getElementById('theme-toggle');
    if (!btn) return;

    function currentTheme() {
      return document.documentElement.getAttribute('data-theme') || 'light';
    }

    function syncPressedState() {
      btn.setAttribute('aria-pressed', currentTheme() === 'dark');
    }

    syncPressedState();

    btn.addEventListener('click', function () {
      var next = currentTheme() === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      try {
        localStorage.setItem('theme', next);
      } catch (e) {}
      syncPressedState();
    });
  })();
</script>

<script>
  // The greedy-nav priority menu measures link widths on load. Google Fonts
  // swap in asynchronously and change those widths slightly, so re-trigger
  // the nav's resize handler once fonts are actually ready to avoid a
  // clipped/overflowing menu item.
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(function () {
      window.dispatchEvent(new Event('resize'));
    });
  }
</script>
